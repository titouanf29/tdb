<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" style="background:#0a0a0f">
  <defs>
    <linearGradient id="bandArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="25" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">Bandes de Bollinger: Squeeze et Expansion</text>

  <!-- Band area fill -->
  <path d="M50,100 Q100,90 150,95 T250,70 T350,85 T400,150 T450,100 T500,90 T550,85
           L550,180 Q500,190 450,185 T400,230 T350,195 T250,205 T150,180 T100,175 T50,180 Z"
        fill="url(#bandArea)"/>

  <!-- Upper Band -->
  <path d="M50,100 Q100,90 150,95 T250,70 T350,85 T400,150 T450,100 T500,90 T550,85"
        fill="none" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Middle Band (SMA) -->
  <path d="M50,140 Q100,135 150,140 T250,125 T350,140 T400,190 T450,140 T500,135 T550,130"
        fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Lower Band -->
  <path d="M50,180 Q100,175 150,180 T250,200 T350,195 T400,230 T450,185 T500,180 T550,175"
        fill="none" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Price candles/line -->
  <path d="M50,150 Q80,145 100,155 T150,160 T200,140 T250,115 T300,130 T350,145 T400,200 T450,150 T500,130 T550,125"
        fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Squeeze zone annotation -->
  <rect x="195" y="55" width="70" height="25" fill="#8b5cf6" fill-opacity="0.2" rx="3"/>
  <text x="230" y="72" fill="#8b5cf6" font-size="10" text-anchor="middle" font-weight="bold">SQUEEZE</text>
  <line x1="230" y1="80" x2="230" y2="95" stroke="#8b5cf6" stroke-width="1"/>

  <!-- Expansion zone annotation -->
  <rect x="370" y="225" width="80" height="25" fill="#ef4444" fill-opacity="0.2" rx="3"/>
  <text x="410" y="242" fill="#ef4444" font-size="10" text-anchor="middle" font-weight="bold">EXPANSION</text>

  <!-- Touch upper band -->
  <circle cx="250" cy="115" r="6" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="250" y="50" fill="#ef4444" font-size="9" text-anchor="middle">Surachat potentiel</text>
  <line x1="250" y1="55" x2="250" y2="109" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Touch lower band -->
  <circle cx="400" cy="200" r="6" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="260" fill="#22c55e" font-size="9" text-anchor="middle">Survente potentielle</text>

  <!-- Legend -->
  <rect x="50" y="270" width="200" height="45" fill="#111" rx="5"/>
  <line x1="60" y1="285" x2="90" y2="285" stroke="#8b5cf6" stroke-width="2"/>
  <text x="100" y="289" fill="#888" font-size="10">Bandes (2 ecarts-types)</text>
  <line x1="60" y1="302" x2="90" y2="302" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="100" y="306" fill="#888" font-size="10">SMA 20 (Moyenne)</text>

  <!-- Info -->
  <rect x="380" y="270" width="170" height="45" fill="#111" rx="5"/>
  <text x="465" y="288" fill="#8b5cf6" font-size="9" text-anchor="middle">Bandes serrees = Squeeze</text>
  <text x="465" y="303" fill="#888" font-size="9" text-anchor="middle">Mouvement explosif a venir!</text>
</svg>