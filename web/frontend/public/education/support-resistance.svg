<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" style="background:#0a0a0f">
  <!-- Title -->
  <text x="300" y="25" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">Supports et Resistances: Zones Cles</text>

  <!-- Resistance zone -->
  <rect x="50" y="60" width="500" height="25" fill="#ef4444" fill-opacity="0.15"/>
  <line x1="50" y1="72" x2="550" y2="72" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="560" y="77" fill="#ef4444" font-size="11" font-weight="bold">RESISTANCE</text>

  <!-- Support zone -->
  <rect x="50" y="215" width="500" height="25" fill="#22c55e" fill-opacity="0.15"/>
  <line x1="50" y1="227" x2="550" y2="227" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="560" y="232" fill="#22c55e" font-size="11" font-weight="bold">SUPPORT</text>

  <!-- Price action -->
  <path d="M60,200 L100,180 L130,220 L160,200 L190,150 L220,80 L240,75 L260,85 L290,130 L320,160 L350,220 L380,230 L410,210 L440,180 L470,140 L500,100 L530,75"
        fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Bounce points on support -->
  <circle cx="130" cy="220" r="6" fill="#22c55e"/>
  <circle cx="350" cy="220" r="6" fill="#22c55e"/>
  <circle cx="380" cy="230" r="6" fill="#22c55e"/>

  <!-- Rejection points on resistance -->
  <circle cx="220" cy="80" r="6" fill="#ef4444"/>
  <circle cx="260" cy="85" r="6" fill="#ef4444"/>
  <circle cx="530" cy="75" r="6" fill="#ef4444"/>

  <!-- Annotations -->
  <text x="130" y="250" fill="#22c55e" font-size="9" text-anchor="middle">Rebond 1</text>
  <text x="365" y="255" fill="#22c55e" font-size="9" text-anchor="middle">Rebonds 2,3</text>
  <text x="240" y="55" fill="#ef4444" font-size="9" text-anchor="middle">Rejets</text>
  <text x="530" y="55" fill="#ef4444" font-size="9" text-anchor="middle">Rejet</text>

  <!-- Info boxes -->
  <rect x="50" y="270" width="160" height="45" fill="#111" rx="5"/>
  <text x="130" y="288" fill="#22c55e" font-size="10" text-anchor="middle" font-weight="bold">SUPPORT</text>
  <text x="130" y="303" fill="#888" font-size="9" text-anchor="middle">Zone d'achat potentiel</text>

  <rect x="220" y="270" width="160" height="45" fill="#111" rx="5"/>
  <text x="300" y="288" fill="#ef4444" font-size="10" text-anchor="middle" font-weight="bold">RESISTANCE</text>
  <text x="300" y="303" fill="#888" font-size="9" text-anchor="middle">Zone de vente potentiel</text>

  <rect x="390" y="270" width="160" height="45" fill="#111" rx="5"/>
  <text x="470" y="288" fill="#8b5cf6" font-size="10" text-anchor="middle" font-weight="bold">CASSURE</text>
  <text x="470" y="303" fill="#888" font-size="9" text-anchor="middle">Support casse = Resistance</text>
</svg>