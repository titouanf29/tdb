<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" style="background:#0a0a0f">
  <defs>
    <linearGradient id="histUp" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="histDown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="25" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">MACD: Croisements et Histogramme</text>

  <!-- Zero line -->
  <line x1="50" y1="150" x2="550" y2="150" stroke="#444" stroke-width="2"/>
  <text x="40" y="155" fill="#666" font-size="10" text-anchor="end">0</text>

  <!-- Histogram bars -->
  <rect x="70" y="150" width="15" height="30" fill="url(#histDown)"/>
  <rect x="90" y="150" width="15" height="25" fill="url(#histDown)"/>
  <rect x="110" y="150" width="15" height="15" fill="url(#histDown)"/>
  <rect x="130" y="145" width="15" height="5" fill="url(#histDown)"/>
  <rect x="150" y="140" width="15" height="10" fill="url(#histUp)"/>
  <rect x="170" y="125" width="15" height="25" fill="url(#histUp)"/>
  <rect x="190" y="110" width="15" height="40" fill="url(#histUp)"/>
  <rect x="210" y="100" width="15" height="50" fill="url(#histUp)"/>
  <rect x="230" y="95" width="15" height="55" fill="url(#histUp)"/>
  <rect x="250" y="100" width="15" height="50" fill="url(#histUp)"/>
  <rect x="270" y="110" width="15" height="40" fill="url(#histUp)"/>
  <rect x="290" y="125" width="15" height="25" fill="url(#histUp)"/>
  <rect x="310" y="140" width="15" height="10" fill="url(#histUp)"/>
  <rect x="330" y="150" width="15" height="5" fill="url(#histDown)"/>
  <rect x="350" y="150" width="15" height="15" fill="url(#histDown)"/>
  <rect x="370" y="150" width="15" height="30" fill="url(#histDown)"/>
  <rect x="390" y="150" width="15" height="45" fill="url(#histDown)"/>
  <rect x="410" y="150" width="15" height="50" fill="url(#histDown)"/>
  <rect x="430" y="150" width="15" height="40" fill="url(#histDown)"/>
  <rect x="450" y="150" width="15" height="25" fill="url(#histDown)"/>
  <rect x="470" y="150" width="15" height="10" fill="url(#histDown)"/>
  <rect x="490" y="140" width="15" height="10" fill="url(#histUp)"/>
  <rect x="510" y="125" width="15" height="25" fill="url(#histUp)"/>

  <!-- MACD Line -->
  <path d="M77,190 Q100,185 130,165 T190,100 T250,85 T310,130 T370,180 T430,210 T490,170 T530,120"
        fill="none" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Signal Line -->
  <path d="M77,180 Q100,175 130,160 T190,115 T250,95 T310,120 T370,165 T430,195 T490,175 T530,135"
        fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Buy signal -->
  <circle cx="150" cy="145" r="8" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="150" y="225" fill="#22c55e" font-size="10" text-anchor="middle">ACHAT</text>
  <line x1="150" y1="145" x2="150" y2="215" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Sell signal -->
  <circle cx="330" cy="140" r="8" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="330" y="225" fill="#ef4444" font-size="10" text-anchor="middle">VENTE</text>
  <line x1="330" y1="148" x2="330" y2="215" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Another buy -->
  <circle cx="490" cy="155" r="8" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="490" y="225" fill="#22c55e" font-size="10" text-anchor="middle">ACHAT</text>
  <line x1="490" y1="163" x2="490" y2="215" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Legend -->
  <rect x="50" y="250" width="120" height="40" fill="#111" rx="5"/>
  <line x1="60" y1="265" x2="90" y2="265" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="100" y="269" fill="#888" font-size="10">Ligne MACD</text>
  <line x1="60" y1="280" x2="90" y2="280" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="100" y="284" fill="#888" font-size="10">Ligne Signal</text>

  <!-- Info box -->
  <rect x="420" y="250" width="130" height="40" fill="#111" rx="5"/>
  <text x="485" y="268" fill="#22c55e" font-size="9" text-anchor="middle">MACD > Signal = Achat</text>
  <text x="485" y="283" fill="#ef4444" font-size="9" text-anchor="middle">MACD &lt; Signal = Vente</text>
</svg>