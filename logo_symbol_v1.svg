<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </radialGradient>

    <!-- Bar 1 gradient (left / shortest) -->
    <linearGradient id="g1" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Bar 2 gradient (middle) -->
    <linearGradient id="g2" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2D2A9E"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Bar 3 gradient (right / tallest) -->
    <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3B1FA8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Trend line gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for top dots -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shine overlay clip -->
    <clipPath id="bar1clip"><rect x="23" y="115" width="40" height="68" rx="10"/></clipPath>
    <clipPath id="bar2clip"><rect x="80" y="76" width="40" height="107" rx="10"/></clipPath>
    <clipPath id="bar3clip"><rect x="137" y="28" width="40" height="155" rx="10"/></clipPath>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="200" height="200" rx="38" fill="url(#bgGrad)"/>

  <!-- Very faint grid (chart feel) -->
  <line x1="20" y1="183" x2="180" y2="183" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>
  <line x1="20" y1="150" x2="180" y2="150" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <line x1="20" y1="117" x2="180" y2="117" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <line x1="20" y1="84"  x2="180" y2="84"  stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <line x1="20" y1="51"  x2="180" y2="51"  stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>

  <!-- ===== BAR 1 — LEFT, SHORTEST ===== -->
  <!-- Shadow -->
  <rect x="26" y="118" width="34" height="65" rx="9" fill="#1E3A8A" opacity="0.4" transform="translate(2,4)"/>
  <!-- Bar body -->
  <rect x="26" y="115" width="34" height="68" rx="10" fill="url(#g1)"/>
  <!-- Shine overlay -->
  <rect x="26" y="115" width="16" height="68" rx="0" fill="white" opacity="0.06" clip-path="url(#bar1clip)"/>

  <!-- ===== BAR 2 — MIDDLE ===== -->
  <!-- Shadow -->
  <rect x="83" y="79" width="34" height="104" rx="9" fill="#2D2A9E" opacity="0.4" transform="translate(2,4)"/>
  <!-- Bar body -->
  <rect x="83" y="76" width="34" height="107" rx="10" fill="url(#g2)"/>
  <!-- Shine -->
  <rect x="83" y="76" width="16" height="107" rx="0" fill="white" opacity="0.06" clip-path="url(#bar2clip)"/>

  <!-- ===== BAR 3 — RIGHT, TALLEST ===== -->
  <!-- Shadow -->
  <rect x="140" y="31" width="34" height="152" rx="9" fill="#3B1FA8" opacity="0.4" transform="translate(2,4)"/>
  <!-- Bar body -->
  <rect x="140" y="28" width="34" height="155" rx="10" fill="url(#g3)"/>
  <!-- Shine -->
  <rect x="140" y="28" width="16" height="155" rx="0" fill="white" opacity="0.06" clip-path="url(#bar3clip)"/>

  <!-- ===== TREND LINE connecting tops ===== -->
  <!-- Glow under -->
  <polyline
    points="43,108  100,69  157,20"
    fill="none"
    stroke="url(#trendGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.25"
    transform="translate(0,2)"/>
  <!-- Crisp line -->
  <polyline
    points="43,108  100,69  157,20"
    fill="none"
    stroke="url(#trendGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- ===== TOP INDICATOR DOTS ===== -->
  <!-- Bar 1 top dot -->
  <circle cx="43" cy="108" r="7" fill="#3B82F6" opacity="0.3" filter="url(#dotGlow)"/>
  <circle cx="43" cy="108" r="4.5" fill="#3B82F6"/>
  <circle cx="43" cy="108" r="2"   fill="#BFDBFE"/>

  <!-- Bar 2 top dot -->
  <circle cx="100" cy="69" r="8"  fill="#6366F1" opacity="0.3" filter="url(#dotGlow)"/>
  <circle cx="100" cy="69" r="5"  fill="#6366F1"/>
  <circle cx="100" cy="69" r="2"  fill="#C7D2FE"/>

  <!-- Bar 3 top dot (largest, brightest) -->
  <circle cx="157" cy="20" r="10" fill="#8B5CF6" opacity="0.35" filter="url(#dotGlow)"/>
  <circle cx="157" cy="20" r="6.5" fill="#8B5CF6"/>
  <circle cx="157" cy="20" r="2.5" fill="#DDD6FE"/>

  <!-- Arrow above bar 3 -->
  <line x1="157" y1="20" x2="157" y2="10" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <polyline
    points="151,15  157,7  163,15"
    fill="none"
    stroke="#C4B5FD"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"/>
</svg>
