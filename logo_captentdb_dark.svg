<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="580" height="160">
  <defs>
    <!-- Main brand gradient: electric blue → violet -->
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#5B4FF0"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Icon bg gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2A50"/>
      <stop offset="100%" stop-color="#1C1040"/>
    </linearGradient>

    <!-- Text gradient for "TDB" (userSpaceOnUse = absolute coords) -->
    <linearGradient id="tdbGrad" x1="143" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for the icon border -->
    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="580" height="160" rx="20" fill="#0A0E1A"/>

  <!-- Subtle noise texture lines (very faint) -->
  <line x1="0" y1="40"  x2="580" y2="40"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0" y1="80"  x2="580" y2="80"  stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>
  <line x1="0" y1="120" x2="580" y2="120" stroke="#ffffff" stroke-width="0.4" opacity="0.03"/>

  <!-- ============ ICON CONTAINER ============ -->
  <!-- Outer glow ring -->
  <rect x="18" y="18" width="108" height="124" rx="24" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.4" filter="url(#borderGlow)"/>
  <!-- Crisp border -->
  <rect x="18" y="18" width="108" height="124" rx="24" fill="none" stroke="url(#brandGrad)" stroke-width="1.2" opacity="0.8"/>
  <!-- Icon background -->
  <rect x="20" y="20" width="104" height="120" rx="22" fill="url(#iconBg)"/>

  <!-- Grid lines inside icon (very subtle) -->
  <line x1="30" y1="102" x2="114" y2="102" stroke="#ffffff" stroke-width="0.6" opacity="0.08"/>
  <line x1="30" y1="84"  x2="114" y2="84"  stroke="#ffffff" stroke-width="0.6" opacity="0.08"/>
  <line x1="30" y1="66"  x2="114" y2="66"  stroke="#ffffff" stroke-width="0.6" opacity="0.08"/>
  <line x1="30" y1="48"  x2="114" y2="48"  stroke="#ffffff" stroke-width="0.6" opacity="0.08"/>

  <!-- Vertical grid lines -->
  <line x1="51"  y1="36" x2="51"  y2="125" stroke="#ffffff" stroke-width="0.6" opacity="0.08"/>
  <line x1="72"  y1="36" x2="72"  y2="125" stroke="#ffffff" stroke-width="0.6" opacity="0.08"/>
  <line x1="93"  y1="36" x2="93"  y2="125" stroke="#ffffff" stroke-width="0.6" opacity="0.08"/>

  <!-- ============ CHART LINE ============ -->
  <!-- Drop shadow for the line -->
  <polyline
    points="34,115  51,98  68,84  86,62  105,40"
    fill="none"
    stroke="#7C3AED"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.3"
    transform="translate(0,3)"/>

  <!-- Main ascending chart line -->
  <polyline
    points="34,115  51,98  68,84  86,62  105,40"
    fill="none"
    stroke="url(#brandGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Area fill under chart -->
  <polygon
    points="34,115  51,98  68,84  86,62  105,40  105,125  34,125"
    fill="url(#brandGrad)"
    opacity="0.07"/>

  <!-- Chart dots -->
  <circle cx="34"  cy="115" r="3.5" fill="#2563EB" opacity="0.9"/>
  <circle cx="51"  cy="98"  r="3.5" fill="#3D57EC" opacity="0.9"/>
  <circle cx="68"  cy="84"  r="3.5" fill="#5B4FF0" opacity="0.9"/>
  <circle cx="86"  cy="62"  r="4"   fill="#6D45E8" opacity="0.9"/>
  <!-- Top dot (highlighted) -->
  <circle cx="105" cy="40"  r="6"   fill="#7C3AED" filter="url(#glow)"/>
  <circle cx="105" cy="40"  r="3"   fill="#C4B5FD"/>

  <!-- ============ UPWARD ARROW ============ -->
  <!-- Vertical stem of arrow (extending above top dot) -->
  <line x1="105" y1="40" x2="105" y2="29" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow head -->
  <polyline
    points="99,35  105,26  111,35"
    fill="none"
    stroke="#C4B5FD"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- ============ WORDMARK ============ -->

  <!-- "CAPTEN" — white, ultra-bold -->
  <text
    x="148" y="80"
    font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif"
    font-size="44"
    font-weight="900"
    fill="white"
    letter-spacing="-0.5">CAPTEN</text>

  <!-- Thin horizontal rule -->
  <line x1="148" y1="91" x2="540" y2="91" stroke="url(#brandGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- "TDB" — gradient, light weight, wide tracking -->
  <text
    x="150" y="113"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="300"
    fill="url(#tdbGrad)"
    letter-spacing="10">TDB</text>

  <!-- Dot separator between TDB and tagline (decorative) -->
  <circle cx="226" cy="128" r="1.5" fill="#4B5563"/>

  <!-- Tagline -->
  <text
    x="148" y="137"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#4B5563"
    letter-spacing="3.8">LA BOURSE, ENFIN CLAIRE</text>

  <!-- Small badge / accent dot top-right of icon -->
  <circle cx="116" cy="26" r="5" fill="#2563EB" filter="url(#glow)"/>
  <circle cx="116" cy="26" r="2.5" fill="#93C5FD"/>
</svg>
