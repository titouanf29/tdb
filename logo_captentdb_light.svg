<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="580" height="160">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#5B4FF0"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="tdbGrad" x1="143" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="580" height="160" rx="20" fill="#FFFFFF"/>
  <rect width="580" height="160" rx="20" fill="#F8FAFF" opacity="0.6"/>

  <!-- Icon border -->
  <rect x="18" y="18" width="108" height="124" rx="24" fill="none" stroke="url(#brandGrad)" stroke-width="1.2" opacity="0.6"/>
  <!-- Icon background -->
  <rect x="20" y="20" width="104" height="120" rx="22" fill="url(#iconBg)"/>

  <!-- Grid lines -->
  <line x1="30" y1="102" x2="114" y2="102" stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <line x1="30" y1="84"  x2="114" y2="84"  stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <line x1="30" y1="66"  x2="114" y2="66"  stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <line x1="30" y1="48"  x2="114" y2="48"  stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <line x1="51"  y1="36" x2="51"  y2="125" stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <line x1="72"  y1="36" x2="72"  y2="125" stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>
  <line x1="93"  y1="36" x2="93"  y2="125" stroke="#2563EB" stroke-width="0.5" opacity="0.12"/>

  <!-- Area fill -->
  <polygon
    points="34,115  51,98  68,84  86,62  105,40  105,125  34,125"
    fill="url(#brandGrad)"
    opacity="0.08"/>

  <!-- Chart line -->
  <polyline
    points="34,115  51,98  68,84  86,62  105,40"
    fill="none"
    stroke="url(#brandGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Chart dots -->
  <circle cx="34"  cy="115" r="3.5" fill="#2563EB" opacity="0.8"/>
  <circle cx="51"  cy="98"  r="3.5" fill="#3D57EC" opacity="0.8"/>
  <circle cx="68"  cy="84"  r="3.5" fill="#5B4FF0" opacity="0.8"/>
  <circle cx="86"  cy="62"  r="4"   fill="#6D45E8"/>
  <circle cx="105" cy="40"  r="6"   fill="#7C3AED"/>
  <circle cx="105" cy="40"  r="3"   fill="#DDD6FE"/>

  <!-- Arrow -->
  <line x1="105" y1="40" x2="105" y2="29" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <polyline
    points="99,35  105,26  111,35"
    fill="none"
    stroke="#7C3AED"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Badge -->
  <circle cx="116" cy="26" r="5" fill="#2563EB"/>
  <circle cx="116" cy="26" r="2.5" fill="#BFDBFE"/>

  <!-- WORDMARK dark on light bg -->
  <text
    x="148" y="80"
    font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif"
    font-size="44"
    font-weight="900"
    fill="#0F172A"
    letter-spacing="-0.5">CAPTEN</text>

  <line x1="148" y1="91" x2="540" y2="91" stroke="url(#brandGrad)" stroke-width="0.8" opacity="0.4"/>

  <text
    x="150" y="113"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="300"
    fill="url(#tdbGrad)"
    letter-spacing="10">TDB</text>

  <text
    x="148" y="137"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#94A3B8"
    letter-spacing="3.8">LA BOURSE, ENFIN CLAIRE</text>
</svg>
