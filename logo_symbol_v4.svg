<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A14"/>
    </radialGradient>

    <!-- Petal gradients -->
    <linearGradient id="p1" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1E2080"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="p4" x1="1" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!--
    CONCEPT: 4 smooth organic "blades" radiating from center,
    each rotated 90°. Like Claude's logo but with a finance flavor.
    The blades are asymmetric teardrop shapes — wide at center, tapered at tips.
    Together they form a cross/star that reads as both:
      • A compass rose (navigation = Capten)
      • A 4-point chart signal (trading = TDB)
    The blades going UP + RIGHT are the brightest (bull/growth direction).
    The blades going DOWN + LEFT are darker (base/foundation).
  -->

  <!-- Center glow blob -->
  <circle cx="100" cy="100" r="28" fill="#3B82F6" opacity="0.08" filter="url(#bigGlow)"/>

  <!--
    Each blade: M center  →  bezier to tip  →  bezier back to center
    Center = (100, 100)
    Tips:
      UP    = (100, 20)
      RIGHT = (180, 100)
      DOWN  = (100, 180)
      LEFT  = (20, 100)
    Width at center: ~30 each side
  -->

  <!-- ── BLADE DOWN-LEFT (darkest, foundation) ── -->
  <path
    d="M 100,100
       C 80,115  40,130  20,100
       C 40,70   80,85   100,100 Z"
    fill="url(#p4)"
    opacity="0.7"/>

  <!-- ── BLADE DOWN (dark blue) ── -->
  <path
    d="M 100,100
       C 115,120  130,160  100,180
       C 70,160   85,120   100,100 Z"
    fill="url(#p1)"
    opacity="0.8"/>

  <!-- ── BLADE RIGHT (indigo, medium-bright) ── -->
  <path
    d="M 100,100
       C 120,85   160,70   180,100
       C 160,130  120,115  100,100 Z"
    fill="url(#p2)"/>

  <!-- ── BLADE UP (brightest — the rising direction) ── -->
  <path
    d="M 100,100
       C 85,80   70,40   100,20
       C 130,40  115,80  100,100 Z"
    fill="url(#p3)"
    filter="url(#glow)"/>

  <!-- Highlight sheen on UP blade -->
  <path
    d="M 100,100
       C 95,82  89,44  100,20
       C 105,42  106,82  100,100 Z"
    fill="white"
    opacity="0.08"/>

  <!-- ── CENTER DISC ── -->
  <!-- Glow ring -->
  <circle cx="100" cy="100" r="16" fill="#3B82F6" opacity="0.15" filter="url(#bigGlow)"/>
  <!-- Ring -->
  <circle cx="100" cy="100" r="14" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.6"/>
  <!-- Fill -->
  <circle cx="100" cy="100" r="12" fill="#0F172A"/>
  <!-- Inner accent -->
  <circle cx="100" cy="100" r="5"  fill="#4F46E5" opacity="0.9"/>
  <circle cx="100" cy="100" r="2.5" fill="#A5B4FC"/>

  <!-- ── TIP GLOW DOTS ── -->
  <!-- TOP tip (brightest) -->
  <circle cx="100" cy="20" r="12" fill="#A855F7" opacity="0.2" filter="url(#bigGlow)"/>
  <circle cx="100" cy="20" r="5.5" fill="#A855F7" filter="url(#glow)"/>
  <circle cx="100" cy="20" r="2.5" fill="#F3E8FF"/>

  <!-- RIGHT tip -->
  <circle cx="180" cy="100" r="9"  fill="#6366F1" opacity="0.2" filter="url(#glow)"/>
  <circle cx="180" cy="100" r="4.5" fill="#6366F1"/>
  <circle cx="180" cy="100" r="2"   fill="#E0E7FF"/>

  <!-- DOWN tip -->
  <circle cx="100" cy="180" r="8"  fill="#3B82F6" opacity="0.18"/>
  <circle cx="100" cy="180" r="4"  fill="#3B82F6"/>
  <circle cx="100" cy="180" r="1.8" fill="#DBEAFE"/>

  <!-- LEFT tip (dimmest) -->
  <circle cx="20" cy="100" r="6"   fill="#1E40AF" opacity="0.5"/>
  <circle cx="20" cy="100" r="3"   fill="#1E40AF"/>
</svg>
